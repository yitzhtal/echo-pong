{{- if .Values.ingress.enabled -}}
{{- $provider := default "aws" .Values.ingress.provider -}}
{{- $providerConfig := default dict (index .Values.ingress.providers $provider) -}}
{{- $providerClassName := default "" (get $providerConfig "className") -}}
{{- $className := default $providerClassName .Values.ingress.className -}}
{{- $providerAnnotations := default dict (get $providerConfig "annotations") -}}
{{- $annotations := mergeOverwrite (deepCopy $providerAnnotations) (default dict .Values.ingress.annotations) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "echo-pong.fullname" . }}
  labels:
    {{- include "echo-pong.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "echo-pong.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
