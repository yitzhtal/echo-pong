name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  binaries:
    name: binary ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          version="${GITHUB_REF_NAME}"
          archive="echo-pong_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          binary="echo-pong"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary="${binary}.exe"
          fi

          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags="-s -w -buildid=" -o "dist/${binary}" .

          (
            cd dist
            if [ "${{ matrix.goos }}" = "windows" ]; then
              zip "${archive}.zip" "${binary}"
              shasum -a 256 "${archive}.zip" > "${archive}.zip.sha256"
            else
              tar -czf "${archive}.tar.gz" "${binary}"
              shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
            fi
            rm "${binary}"
          )

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: echo-pong-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build amd64 scan image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:scan-amd64-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan amd64 image
        uses: anchore/scan-action@v7.4.0
        with:
          image: ${{ steps.image.outputs.name }}:scan-amd64-${{ github.sha }}
          fail-build: true
          severity-cutoff: high

      - name: Build arm64 scan image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.name }}:scan-arm64-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan arm64 image
        uses: anchore/scan-action@v7.4.0
        with:
          image: ${{ steps.image.outputs.name }}:scan-arm64-${{ github.sha }}
          fail-build: true
          severity-cutoff: high

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    needs:
      - binaries
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: echo-pong-*
          merge-multiple: true

      - name: Create aggregate checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
