name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: test and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0

      - name: Lint Helm chart
        run: helm lint charts/echo-pong

      - name: Render Helm chart
        run: helm template echo-pong charts/echo-pong --namespace echo-pong >/tmp/echo-pong-rendered.yaml
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: echo-pong:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Anchore scan local image
        uses: anchore/scan-action@v7.4.0
        with:
          image: echo-pong:ci
          fail-build: false
          severity-cutoff: high
          output-format: table

      - name: Trivy scan local image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: echo-pong:ci
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL
