name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: test and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0

      - name: Lint Helm chart
        run: helm lint --strict charts/echo-pong

      - name: Render Helm chart
        run: helm template echo-pong charts/echo-pong --namespace echo-pong >/tmp/echo-pong-rendered.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: echo-pong:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Anchore scan local image
        uses: anchore/scan-action@v7.4.0
        with:
          image: echo-pong:ci
          fail-build: false
          severity-cutoff: high
          output-format: table

      - name: Trivy scan local image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: echo-pong:ci
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: HIGH,CRITICAL

  helm-install:
    name: helm install on k8s ${{ matrix.kubernetes }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.36"
            cluster: echo-pong-136
            k3s_image: docker.io/rancher/k3s:v1.36.0-k3s1
          - kubernetes: "1.35"
            cluster: echo-pong-135
            k3s_image: docker.io/rancher/k3s:v1.35.4-k3s1
          - kubernetes: "1.34"
            cluster: echo-pong-134
            k3s_image: docker.io/rancher/k3s:v1.34.7-k3s1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0

      - name: Build local image
        run: docker build -t echo-pong:e2e .

      - name: Create k3d cluster
        uses: AbsaOSS/k3d-action@v2.4.0
        with:
          cluster-name: ${{ matrix.cluster }}
          k3d-version: v5.8.3
          args: >-
            --agents 1
            --image ${{ matrix.k3s_image }}
            --wait
            --timeout 180s

      - name: Show cluster version and nodes
        run: |
          kubectl version
          kubectl get nodes -o wide

      - name: Import image into k3d
        run: k3d image import echo-pong:e2e -c "${{ matrix.cluster }}" --verbose

      - name: Prepare namespace and secret
        run: |
          kubectl create namespace echo-pong
          kubectl label namespace echo-pong \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=latest \
            pod-security.kubernetes.io/audit=restricted \
            pod-security.kubernetes.io/audit-version=latest \
            pod-security.kubernetes.io/warn=restricted \
            pod-security.kubernetes.io/warn-version=latest \
            --overwrite
          kubectl create secret generic echo-pong-secret \
            --namespace echo-pong \
            --from-literal=token='test-secret'

      - name: Install Helm chart
        run: |
          helm upgrade --install echo-pong ./charts/echo-pong \
            --namespace echo-pong \
            --set image.repository=echo-pong \
            --set image.tag=e2e \
            --set image.pullPolicy=IfNotPresent \
            --set secret.existingSecret=echo-pong-secret \
            --wait \
            --timeout 180s

      - name: Wait for workload readiness
        run: |
          kubectl rollout status deployment/echo-pong --namespace echo-pong --timeout=180s
          kubectl wait pod \
            --namespace echo-pong \
            --selector app.kubernetes.io/name=echo-pong,app.kubernetes.io/instance=echo-pong,app.kubernetes.io/component=api \
            --for=condition=Ready \
            --timeout=180s

      - name: Run basic health checks through service
        run: |
          kubectl port-forward --namespace echo-pong service/echo-pong 18080:80 >/tmp/echo-pong-port-forward.log 2>&1 &
          port_forward_pid="$!"
          trap 'kill "${port_forward_pid}"' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/health.json \
              && curl -fsS http://127.0.0.1:18080/ready >/tmp/ready.json \
              && curl -fsS -H 'Authorization: Bearer test-secret' http://127.0.0.1:18080/ping >/tmp/ping.json; then
              cat /tmp/health.json
              cat /tmp/ready.json
              cat /tmp/ping.json
              http_status="$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/ping)"
              test "${http_status}" = "401"
              exit 0
            fi
            sleep 2
          done

          cat /tmp/echo-pong-port-forward.log
          exit 1

      - name: Show Kubernetes resources
        if: always()
        run: |
          kubectl get pods --namespace echo-pong -o wide || true
          kubectl get services --namespace echo-pong -o wide || true
          kubectl get deployments --namespace echo-pong -o wide || true
          kubectl get ingresses --namespace echo-pong -o wide || true
          kubectl describe deployment echo-pong --namespace echo-pong || true
          kubectl logs --namespace echo-pong \
            --selector app.kubernetes.io/name=echo-pong,app.kubernetes.io/instance=echo-pong,app.kubernetes.io/component=api \
            --tail=200 || true

      - name: Delete k3d cluster
        if: always()
        run: k3d cluster delete "${{ matrix.cluster }}" || true
